<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Jogo de decoreba do Manual de Procedimentos Básicos de Enfermagem (FVR, 2017): ordenar passos, completar lacunas, múltipla escolha e cartões com repetição espaçada.">
<title>Decoreba Enfermagem</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,700..900&family=IBM+Plex+Mono:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
/* Layout: uma coluna estreita, trilha em lista agrupada por tubo de coleta; fase em tela cheia com dock fixo embaixo. */
:root{
  --bg:#F0F5F4; --surface:#FFFFFF; --surface-2:#E4EDEC; --ink:#0E2A2D; --ink-2:#4A666B; --line:#C8D9D7;
  --teal:#0A766F; --on-teal:#FFFFFF; --teal-soft:#D2EDEA;
  --amber:#A3510A; --amber-fill:#E58A24; --amber-soft:#FBE5CE;
  --red:#B4291F; --red-soft:#F8D8D4; --green:#18773F; --green-soft:#D3EEDC;
  --g1:#3B9AD0; --g2:#D9A91B; --g3:#7A4FA6; --g4:#C23A30; --g5:#3FA455; --g6:#6F8289; --g7:#E07A22; --g8:#0F6F6A;
  --f-display:'Archivo','Arial Narrow',system-ui,sans-serif;
  --f-body:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1819; --surface:#142427; --surface-2:#1C3236; --ink:#E3EFEE; --ink-2:#97B3B6; --line:#2B4549;
    --teal:#38BDB4; --on-teal:#06211F; --teal-soft:#16383A;
    --amber:#F0A24E; --amber-fill:#E58A24; --amber-soft:#3A2A16;
    --red:#FF8A80; --red-soft:#3C1E1D; --green:#6FD392; --green-soft:#17321F;
    --g1:#5BB4E8; --g2:#E8BC3A; --g3:#A47BD0; --g4:#E5645A; --g5:#5CC172; --g6:#93A7AE; --g7:#F29443; --g8:#38BDB4;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1819; --surface:#142427; --surface-2:#1C3236; --ink:#E3EFEE; --ink-2:#97B3B6; --line:#2B4549;
  --teal:#38BDB4; --on-teal:#06211F; --teal-soft:#16383A;
  --amber:#F0A24E; --amber-fill:#E58A24; --amber-soft:#3A2A16;
  --red:#FF8A80; --red-soft:#3C1E1D; --green:#6FD392; --green-soft:#17321F;
  --g1:#5BB4E8; --g2:#E8BC3A; --g3:#A47BD0; --g4:#E5645A; --g5:#5CC172; --g6:#93A7AE; --g7:#F29443; --g8:#38BDB4;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.shell{max-width:660px;margin:0 auto;padding-block:0 48px}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 0}
.brand{display:flex;align-items:center;gap:12px}
.brand h1{margin:0;font:800 30px/1 var(--f-display);font-stretch:75%;letter-spacing:.01em;text-transform:uppercase}
.brand small{display:block;font:500 12px/1.3 var(--f-body);color:var(--ink-2);margin-top:3px}
.tube{flex:none;width:14px;height:34px;border:2px solid var(--ink);border-radius:3px 3px 8px 8px;position:relative;background:var(--surface);overflow:hidden}
.tube::before{content:"";position:absolute;inset:0 0 auto;height:9px;background:var(--c,var(--g3));border-bottom:2px solid var(--ink)}
.tube::after{content:"";position:absolute;inset:auto 0 0;height:46%;background:var(--c,var(--g3));opacity:.35}
.tube.sm{width:10px;height:24px;border-width:1.5px}
.tube.sm::before{height:6px;border-bottom-width:1.5px}
.tabs{display:flex;gap:4px;margin-top:12px;border-bottom:2px solid var(--line)}
.tabs button{flex:1;background:none;border:0;padding:10px 6px 9px;font:600 14px var(--f-body);color:var(--ink-2);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--teal)}
.tabs .pill{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--amber-fill);color:#1d1204;font:600 12px/20px var(--f-mono)}

.view{padding-top:18px;display:flex;flex-direction:column;gap:18px}
.eyebrow{font:600 12px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
h2{margin:0;font:800 22px/1.15 var(--f-display);font-stretch:85%;letter-spacing:.005em}
.muted{color:var(--ink-2)}
.stats{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.stat{display:flex;align-items:center;gap:6px;font:600 15px var(--f-mono)}
.stat svg{width:18px;height:18px}
.stat.xp svg,.stat.xp{color:var(--amber)}
.stat.day svg{color:var(--g4)}
.stat.mast svg{color:var(--teal)}
.ico{display:inline-flex;vertical-align:-3px}
.ico svg{width:1.15em;height:1.15em;fill:currentColor}
.ico.stroke svg{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;border:2px solid var(--ink);background:var(--surface);font:700 15px var(--f-body);text-align:center;box-shadow:0 3px 0 var(--ink);transition:transform .06s,box-shadow .06s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--teal);color:var(--on-teal)}
.btn.warn{background:var(--amber-fill);color:#1d1204}
.btn.block{width:100%}
.btn.small{min-height:36px;padding:0 12px;font-size:13px;border-width:1.5px;box-shadow:0 2px 0 var(--ink);border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.link{background:none;border:0;padding:6px 2px;color:var(--ink-2);text-decoration:underline;font:600 14px var(--f-body)}

/* cta */
.cta{display:flex;flex-direction:column;gap:10px;padding:16px;border:2px solid var(--ink);border-radius:14px;background:var(--surface)}
.cta p{margin:0}
.cta .row{display:flex;flex-wrap:wrap;gap:10px}

/* trilha */
.group{display:flex;flex-direction:column}
.group-h{display:flex;align-items:center;gap:10px;padding:6px 0 10px;border-bottom:2px solid var(--ink)}
.group-h h3{margin:0;font:800 17px/1.1 var(--f-display);font-stretch:85%;text-transform:uppercase;letter-spacing:.03em;flex:1}
.group-h span.count{font:600 12px var(--f-mono);color:var(--ink-2)}
.ch{display:grid;grid-template-columns:1fr auto;gap:0 10px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}
.ch-main{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;background:none;border:0;padding:6px 0;min-width:0}
.ch .num{position:relative;display:grid;place-items:center;width:38px;height:38px;border-radius:7px;font:700 14px var(--f-mono);isolation:isolate}
.ch .num::before{content:"";position:absolute;inset:0;border-radius:7px;background:var(--c);opacity:.2;z-index:-1}
.ch .txt{display:flex;flex-direction:column;min-width:0}
.ch .txt strong{font:700 16px/1.25 var(--f-body);overflow-wrap:anywhere}
.ch .meta{font:500 12px var(--f-mono);color:var(--ink-2);margin-top:2px}
.ch .stars{display:flex;gap:1px;color:var(--line)}
.ch .stars .on{color:var(--amber-fill)}
.stars svg{width:16px;height:16px;fill:currentColor}
.ch .bar{grid-column:1 / -1;height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin:2px 0 4px}
.ch .bar i{display:block;height:100%;background:var(--c);border-radius:3px}
.ch-main:hover .txt strong{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}

/* filtros */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--ink);background:var(--surface);border-radius:999px;padding:6px 12px;font:600 13px var(--f-body)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
details.pick summary{cursor:pointer;font:600 14px var(--f-body);padding:6px 0}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 12px;padding:8px 0}
.pick-grid label{display:flex;gap:8px;align-items:center;font-size:14px;padding:4px 0}
.pick-grid input{width:18px;height:18px;accent-color:var(--teal)}

/* progresso */
.rowbar{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.rowbar .bar{grid-column:1/-1;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.rowbar .bar i{display:block;height:100%;background:var(--c);border-radius:4px}
.rowbar b{font:700 14px var(--f-body)}
.rowbar span{font:600 12px var(--f-mono);color:var(--ink-2)}
.set{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-top:1px solid var(--line)}
.switch{position:relative;width:52px;height:30px;flex:none}
.switch input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:15px;background:var(--surface-2);border:2px solid var(--ink);transition:background .15s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--ink);transition:transform .15s}
.switch input:checked + span{background:var(--teal)}
.switch input:checked + span::after{transform:translateX(22px);background:var(--on-teal)}
.switch input:focus-visible + span{outline:3px solid var(--teal);outline-offset:2px}
textarea{width:100%;min-height:110px;border:1.5px solid var(--ink);border-radius:10px;background:var(--surface);color:var(--ink);font:12px/1.4 var(--f-mono);padding:10px}

/* jogo */
.play{display:flex;flex-direction:column;min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:14px;padding-block:14px 10px}
.x{flex:none;width:40px;height:40px;border-radius:10px;border:2px solid var(--ink);background:var(--surface);display:grid;place-items:center}
.x svg{width:18px;height:18px}
.prog{flex:1;height:14px;border-radius:7px;background:var(--surface-2);border:2px solid var(--ink);overflow:hidden}
.prog i{display:block;height:100%;background:var(--teal);transition:width .25s}
.prog.redo i{background:var(--amber-fill)}
.hearts{display:flex;gap:3px;color:var(--red)}
.hearts svg{width:24px;height:24px;fill:currentColor}
.hearts .lost{color:var(--line)}
.sub{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font:600 12px var(--f-mono);letter-spacing:.04em;color:var(--ink-2);text-transform:uppercase}
.sub .combo{color:var(--amber)}
.stage{flex:1;display:flex;flex-direction:column;gap:18px;padding:14px 0 24px}
.q{font:700 22px/1.4 var(--f-body);overflow-wrap:anywhere}
.cl{font:500 20px/2.15 var(--f-body);overflow-wrap:anywhere}
.cl input{font:600 18px var(--f-body);color:var(--ink);background:var(--surface);border:0;border-bottom:3px solid var(--ink);border-radius:6px 6px 0 0;padding:2px 8px;margin:0 2px;min-width:5ch;max-width:100%;text-align:center;line-height:1.5}
.cl input:focus{border-bottom-color:var(--teal);outline:0;background:var(--teal-soft)}
.cl input.ok,.cl .slot.ok{border-bottom-color:var(--green);background:var(--green-soft);color:var(--green)}
.cl input.bad,.cl .slot.bad{border-bottom-color:var(--red);background:var(--red-soft);color:var(--red)}
.slot{display:inline-block;min-width:5.5ch;min-height:1.8em;padding:0 10px;margin:0 2px;border:0;border-bottom:3px solid var(--ink);border-radius:6px 6px 0 0;background:var(--surface);font:600 18px/1.7 var(--f-body);vertical-align:baseline}
.slot.active{border-bottom-color:var(--teal);background:var(--teal-soft)}
.bank{display:flex;flex-wrap:wrap;gap:10px}
.word{border:2px solid var(--ink);background:var(--surface);border-radius:10px;padding:8px 14px;font:600 16px var(--f-body);box-shadow:0 2px 0 var(--ink)}
.word:disabled{opacity:.3;box-shadow:none}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:2px solid var(--ink);background:var(--surface);border-radius:12px;padding:14px 16px;font:600 17px/1.35 var(--f-body);box-shadow:0 3px 0 var(--ink)}
.opt .k{flex:none;width:26px;height:26px;border-radius:6px;border:2px solid var(--ink);display:grid;place-items:center;font:700 13px var(--f-mono)}
.opt.ok{background:var(--green-soft);border-color:var(--green);box-shadow:0 3px 0 var(--green);color:var(--ink)}
.opt.ok .k{background:var(--green);border-color:var(--green);color:var(--surface)}
.opt.bad{background:var(--red-soft);border-color:var(--red);box-shadow:0 3px 0 var(--red)}
.opt.bad .k{background:var(--red);border-color:var(--red);color:var(--surface)}
.opt:disabled:not(.ok):not(.bad){opacity:.5;box-shadow:none}
.ordw{display:flex;flex-direction:column;gap:14px}
.placed{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;counter-reset:s}
.placed li{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:10px;background:var(--green-soft);border:2px solid var(--green);font:600 15px/1.35 var(--f-body);counter-increment:s}
.placed li::before{content:counter(s);flex:none;min-width:24px;height:24px;border-radius:6px;background:var(--green);color:var(--surface);display:grid;place-items:center;font:700 12px var(--f-mono)}
.slotline{min-height:46px;border:2px dashed var(--line);border-radius:10px;display:grid;place-items:center;color:var(--ink-2);font:600 13px var(--f-mono);text-transform:uppercase;letter-spacing:.05em}
.pool{display:flex;flex-direction:column;gap:8px}
.step{text-align:left;border:2px solid var(--ink);background:var(--surface);border-radius:10px;padding:10px 14px;font:600 15px/1.35 var(--f-body);box-shadow:0 2px 0 var(--ink)}
.step.hint{border-color:var(--teal);background:var(--teal-soft)}
.step.shake{border-color:var(--red);background:var(--red-soft);animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.dock{position:sticky;bottom:0;z-index:15;background:var(--bg);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;border-top:2px solid var(--line)}
.dock.ok{background:var(--green-soft);border-top-color:var(--green)}
.dock.bad{background:var(--red-soft);border-top-color:var(--red)}
.fb{display:flex;flex-direction:column;gap:4px;font-size:15px}
.fb b{font:800 18px var(--f-display);font-stretch:85%;text-transform:uppercase;letter-spacing:.03em}
.dock.ok .fb b{color:var(--green)}
.dock.bad .fb b{color:var(--red)}
.fb .ans{font-weight:600}
.pg{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--f-mono);color:var(--ink-2)}
.dock-row{display:flex;gap:10px}
.dock-row .btn{flex:1}
.banner{padding:10px 14px;border-radius:10px;background:var(--amber-soft);border:2px solid var(--amber-fill);font:600 14px var(--f-body)}

/* flashcard */
.fc{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;border:2px solid var(--ink);border-radius:16px;background:var(--surface);padding:22px 18px;min-height:260px;box-shadow:0 4px 0 var(--ink);text-align:left;width:100%}
.fc .lab{font:600 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.fc .txt{font:600 20px/1.5 var(--f-body);overflow-wrap:anywhere}
.fc mark{background:var(--teal-soft);color:var(--ink);border-bottom:3px solid var(--teal);padding:0 4px;border-radius:4px}
.fc .blank{display:inline-block;min-width:4ch;border-bottom:3px solid var(--ink);text-align:center;color:transparent;user-select:none}
.fc ol{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px;font:500 16px/1.4 var(--f-body)}

/* resultado */
.res{display:flex;flex-direction:column;gap:20px;align-items:stretch;padding-top:24px}
.big-stars{display:flex;gap:8px;justify-content:center;color:var(--line)}
.big-stars svg{width:60px;height:60px;fill:currentColor}
.big-stars .on{color:var(--amber-fill);animation:pop .5s both}
.big-stars .on:nth-child(2){animation-delay:.15s}
.big-stars .on:nth-child(3){animation-delay:.3s}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
.res h2{text-align:center;font-size:30px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);border:2px solid var(--ink);border-radius:12px;background:var(--surface)}
.kv div{padding:12px 6px;text-align:center;border-left:2px solid var(--line)}
.kv div:first-child{border-left:0}
.kv b{display:block;font:700 22px var(--f-mono)}
.kv span{font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.missed{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.missed li{padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-size:15px;line-height:1.45}
.missed mark{background:var(--teal-soft);color:var(--ink);padding:0 3px;border-radius:3px;font-weight:700}
.empty{padding:22px 0;color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.brand h1{font-size:26px}.q{font-size:20px}.cl{font-size:18px}}

</style>
</head>
<body>
<div id="app"></div>
<div id="live" class="sr" role="status" aria-live="polite"></div>
<script>

/* ---------- comparação tolerante ---------- */
function strip(s){ return s.normalize('NFD').replace(/[̀-ͯ]/g,''); }
function keyOf(s){
  s=strip(String(s).toLowerCase()).replace(/[–—−]/g,'-').replace(/(\d)\.(\d)/g,'$1,$2');
  s=s.replace(/(\D),/g,'$1').replace(/,(\D)/g,'$1');
  return s.replace(/[\s.\-_()'"“”´`º°ª\/;:!?]/g,'');
}
function lev(a,b){ var p=[],i,j; for(j=0;j<=b.length;j++) p[j]=j; for(i=1;i<=a.length;i++){ var prev=p[0]; p[0]=i; for(j=1;j<=b.length;j++){ var t=p[j]; p[j]=Math.min(p[j]+1,p[j-1]+1,prev+(a[i-1]===b[j-1]?0:1)); prev=t; } } return p[b.length]; }
function matches(typed,alts){
  var k=keyOf(typed); if(!k) return false;
  for(var i=0;i<alts.length;i++){
    var a=keyOf(alts[i]); if(k===a) return true;
    if(!/\d/.test(a) && a.length>=7){ var tol=a.length>=15?2:1; if(Math.abs(a.length-k.length)<=tol && lev(k,a)<=tol) return true; }
  }
  return false;
}

function pickItems(pool,n,ordCap){
  var t=now();
  var ranked=pool.map(function(it){
    var c=S.cards[it.id], w;
    if(!c) w=3; else if(c.d<=t) w=4+Math.min(c.m,3); else w=0.7+(5-c.b)*0.3;
    return {it:it,k:Math.pow(Math.random(),1/w)};
  }).sort(function(a,b){ return b.k-a.k; });
  var out=[], ords=0;
  for(var i=0;i<ranked.length&&out.length<n;i++){
    var it=ranked[i].it;
    if(it.t==='ord'){ if(ords>=ordCap) continue; ords++; }
    out.push(it);
  }
  return shuffle(out);
}
var poolCache={};
function answerPool(chId){
  if(poolCache[chId]) return poolCache[chId];
  var out=[]; byCh[chId].forEach(function(it){ if(it.t==='cl') it.parts.forEach(function(p){ if(typeof p!=='string') out.push(p.a[0]); }); });
  return poolCache[chId]=out;
}
function distractors(correct,chId,n){
  var num=/\d/.test(correct), ck=keyOf(correct);
  var pool=shuffle(answerPool(chId)).filter(function(a){ return /\d/.test(a)===num && keyOf(a)!==ck; });
  var out=[], seen={}; seen[ck]=1;
  pool.forEach(function(a){ var k=keyOf(a); if(out.length<n && !seen[k]){ seen[k]=1; out.push(a); } });
  if(out.length<n){
    shuffle(ITEMS.filter(function(i){ return i.t==='cl'; })).some(function(it){
      it.parts.some(function(p){ if(typeof p==='string') return false; var a=p.a[0], k=keyOf(a); if(/\d/.test(a)===num && !seen[k]){ seen[k]=1; out.push(a); } return out.length>=n; });
      return out.length>=n;
    });
  }
  return out;
}
function makeEx(it){
  var ex={it:it,t:it.t,lifeLost:false};
  if(it.t==='cl'){
    ex.easy=!!S.easy;
    ex.blanks=it.parts.filter(function(p){ return typeof p!=='string'; });
    if(ex.easy){
      var chips=[]; ex.blanks.forEach(function(b,i){ chips.push({txt:b.a[0],idx:i}); distractors(b.a[0],it.ch,2).forEach(function(d){ chips.push({txt:d,idx:-1}); }); });
      ex.chips=shuffle(chips);
    }
  } else if(it.t==='mc'){
    ex.opts=shuffle(it.o.map(function(t,i){ return {t:t,ok:i===0}; }));
  } else {
    var n=it.steps.length, w=n, start=0;
    if(n>9){ w=6+Math.floor(Math.random()*3); start=Math.floor(Math.random()*(n-w+1)); }
    ex.start=start; ex.w=w; ex.n=n;
    ex.seq=it.steps.slice(start,start+w);
    ex.mix=shuffle(ex.seq.map(function(t,i){ return {t:t,i:i}; }));
    if(w>1 && ex.mix.every(function(x,i){ return x.i===i; })) ex.mix.reverse();
  }
  return ex;
}

  if(it.t==='cl'){ var w=h('span'); it.parts.forEach(function(p){ if(typeof p==='string') w.append(p); else w.append(h('span',{class:'blank'},'_'.repeat(Math.max(5,Math.min(18,p.a[0].length))))); }); return w; }
  if(it.t==='mc') return h('span',null,it.q);
  return h('span',null,'Quais são os passos, na ordem? ',h('b',null,it.title));
}
function cardBack(it){
  if(it.t==='cl') return sentence(it);
  if(it.t==='mc') return h('span',null,it.q+' ',h('mark',null,it.o[0]));
  return h('div',null,h('b',null,it.title), h('ol',null,it.steps.map(function(s){ return h('li',null,s); })));
}
function showCard(){
  var C=cards;
  if(C.empty||C.i>=C.q.length){
    touchDay(); if(!C.empty) save();
    var msg=C.empty?'Não há nada para revisar nesse filtro agora.':'Sessão concluída: '+plural(C.ok+C.bad,'cartão','cartões')+', '+C.ok+' acertos.';
    app.replaceChildren(h('div',{class:'shell'}, h('div',{class:'res'}, h('h2',null,C.empty?'Tudo em dia':'Boa'), h('p',{class:'muted',style:'text-align:center;margin:0'},msg),
      h('div',{style:'display:flex;flex-direction:column;gap:12px'}, h('button',{class:'btn primary block',type:'button',onclick:function(){ startMix(C.sel); }},'Treino misto'), h('button',{class:'btn block',type:'button',onclick:function(){ go('home'); }},'Voltar à trilha')))));
    return;
  }
  var it=C.q[C.i], ch=chById[it.ch];
  var top=h('div',{class:'hud'}, h('button',{class:'x',type:'button','aria-label':'Sair dos cartões',onclick:function(){ save(); go('home'); }},icon('cross',true)), h('div',{class:'prog',role:'progressbar','aria-valuemin':0,'aria-valuemax':C.q.length,'aria-valuenow':C.i},h('i',{style:'width:'+Math.round(100*C.i/C.q.length)+'%'})));
  var card=h('button',{class:'fc',type:'button','aria-label':C.flip?'Resposta':'Virar cartão',onclick:function(){ if(!C.flip){ C.flip=true; showCard(); } }},
    h('span',{class:'lab'},(C.flip?'Resposta':'Pergunta')+' · cap. '+pad2(ch.num)+' '+ch.title),
    h('span',{class:'txt'},C.flip?cardBack(it):cardFront(it)),
    h('span',{class:'pg'},'manual p. '+it.p+(it.img?' · figura ou tabela':'')));
  var d=h('div',{class:'dock'});
  if(!C.flip) d.append(h('button',{class:'btn primary block',type:'button',onclick:function(){ C.flip=true; showCard(); }},'Mostrar resposta'));
  else d.append(h('div',{class:'dock-row'},
    h('button',{class:'btn',type:'button',onclick:function(){ grade(false); }},'Errei'),
    h('button',{class:'btn primary',type:'button',onclick:function(){ grade(true); }},'Acertei')));
  function grade(ok){ gradeCard(it.id,ok); if(ok) C.ok++; else C.bad++; S.xp+=2; save(); C.i++; C.flip=false; showCard(); }
  document.onkeydown=function(e){ if(V.name!=='cards') return; if(e.key===' '||e.key==='Enter'){ if(!C.flip){ e.preventDefault(); C.flip=true; showCard(); } } else if(C.flip&&(e.key==='1'||e.key.toLowerCase()==='e')) grade(false); else if(C.flip&&(e.key==='2'||e.key.toLowerCase()==='a')) grade(true); };
  app.replaceChildren(h('div',{class:'shell play'}, top, h('div',{class:'stage'},card), d));
}

render();
})();

</script>
